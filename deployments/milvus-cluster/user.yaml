# Local development overrides for Milvus Cluster.
# Settings not listed here retain Milvus v2.6.21 defaults.

log:
  level: info
  format: text
  stdout: true

common:
  security:
    authorizationEnabled: false

proxy:
  enableWebUI: true
  accessLog:
    enable: true

trace:
  exporter: otlp
  sampleFraction: 1
  otlp:
    endpoint: jaeger:4317
    method: grpc
    secure: false
  initTimeoutSeconds: 10
