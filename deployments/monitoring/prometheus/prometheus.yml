global:
  # Benchmark concurrency stages currently last only 10 seconds.
  scrape_interval: 1s
  scrape_timeout: 800ms
  evaluation_interval: 5s

scrape_configs:
  - job_name: milvus-cluster
    metrics_path: /metrics
    static_configs:
      - targets: [proxy:9091]
        labels:
          component: proxy
          environment: local
          deployment: cluster
      - targets: [mixcoord:9091]
        labels:
          component: mixcoord
          environment: local
          deployment: cluster
      - targets: [streamingnode:9091]
        labels:
          component: streamingnode
          environment: local
          deployment: cluster
      - targets: [datanode:9091]
        labels:
          component: datanode
          environment: local
          deployment: cluster
      - targets: [querynode:9091]
        labels:
          component: querynode
          environment: local
          deployment: cluster

  - job_name: cadvisor
    metrics_path: /metrics
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          environment: local
