# VectorDBBench 1.0.22 - Milvus HNSW
#
# Run:
#   .\benchmark\vectordbbench\run_benchmark.ps1 -Command milvushnsw
#
# Validate without running:
#   .\benchmark\vectordbbench\run_benchmark.ps1 -Command milvushnsw -DryRun

# SQLite metric collection. QueryNode CPU comes from the Prometheus data source
# used by Grafana and is limited to each concurrent search stage window.
_metrics:
  prometheus_url: http://localhost:9090
  timezone: "+08:00"
  querynode_cpu_limit_cores: 2
  query_range_step_seconds: 1
  rate_window: 10s
  timeout_seconds: 15

milvushnsw:
  # Milvus connection
  uri: http://localhost:19530
  num_shards: 1
  replica_number: 1

  # Dataset and test stages
  case_type: Performance1536D50K
  drop_old: true
  load: true
  load_concurrency: 4
  search_serial: true
  search_concurrent: true

  # Search workload
  k: 100
  concurrency_duration: 30
  num_concurrency: "1"
  concurrency_timeout: 3600

  # HNSW index and search parameters
  m: 16
  ef_construction: 128
  ef_search: 128

  # Result labels. The runner appends HHmmssfff to task_label automatically,
  # so repeated runs on the same day do not overwrite each other.
  db_label: local-cluster-8c10_5g-2_6_21
  task_label: hnsw-performance-cluster-local
